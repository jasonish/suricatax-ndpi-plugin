[package]
name = "suricatax-ndpi-plugin"

# We're playing with versions here, not really sure how to make it work.
# - Suricata 8.0, plugin version 24 for nDPI 6.0
version = "8.0.25+ndpi6.0"

edition = "2021"
rust-version = "1.75.0"
description = "Suricata 8.0.x nDPI 6 plugin"
# License of the plugin source; bundled dependencies retain their own terms.
license = "LGPL-3.0-only"
readme = "README.md"
publish = false
build = "build.rs"

[workspace]
members = [".", "ndpi-sys"]

[lib]
name = "ndpi"
crate-type = ["cdylib"]

[dependencies]
# Constrain serde_json's preserve_order dependency for Rust 1.75 compatibility.
# indexmap 2.14.2 requires Rust 1.85.
indexmap = "=2.11.4"
ndpi-sys = { version = "6.0.0", path = "ndpi-sys" }
serde_json = { version = "1.0", features = ["preserve_order"] }
suricatax80-plugin-utils = { version = "0.2.0-alpha.2" }
