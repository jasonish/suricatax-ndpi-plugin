name: Build plugin

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux ${{ matrix.arch }} plugin
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            builder: cargo
            artifact: ndpi.so
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            builder: cross
            artifact: ndpi-aarch64.so

    env:
      RUST_TOOLCHAIN: 1.75.0
      RUST_TARGET: ${{ matrix.target }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      ARTIFACT_FILE: ndpi.so

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify build platform
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --version 0.2.5 --locked

      - name: Build plugin
        run: ${{ matrix.builder }} build --release --locked --target "$RUST_TARGET"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/$RUST_TARGET/release/libndpi.so" "dist/$ARTIFACT_FILE"
          ls -l dist/

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_FILE }}
          if-no-files-found: error
